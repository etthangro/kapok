<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kapok · Menú</title><meta name="theme-color" content="#f6f2e9">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2e9;--deep:#3b3a30;--ink:#3b3a30;--mut:#7d7b69;--line:rgba(59,58,48,.14);--f:'Source Serif 4',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:300;padding-bottom:env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer}
#home{position:fixed;inset:0;z-index:20;background:var(--deep);color:#efe6d4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s}
body.open #home{opacity:0;pointer-events:none}
#logo{width:min(56vw,220px);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:none;overflow:hidden;animation:br 4s ease-in-out infinite}
#logo img{width:100%;height:100%;display:block}
@keyframes br{50%{transform:scale(1.03)}}
#home h1{font-weight:300;letter-spacing:.4em;font-size:26px;margin:36px 0 6px;padding-left:.4em}
#home em{opacity:.65;font-size:16px}
#home small{margin-top:44px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;animation:fd 2.6s ease-in-out infinite}
@keyframes fd{50%{opacity:.2}}
header{position:sticky;top:0;z-index:10;background:rgba(246,242,233,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0}
.bar .mini{width:36px;height:36px;border-radius:50%;border:0;padding:0;overflow:hidden;background:none}
.bar img{width:100%;height:100%;display:block}
.tabs{display:flex;gap:26px}
.tabs button{border:0;background:none;padding:8px 0;font-size:16px;color:var(--mut);border-bottom:1.5px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.chips{display:flex;gap:22px;overflow-x:auto;padding:10px 20px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;color:var(--mut);text-decoration:none;font-size:14px;transition:.2s}
.chips a.on{color:var(--ink);font-weight:600}
main{max-width:560px;margin:0 auto;padding:0 20px 20px}
.promo{margin:28px 0 0;font-style:italic;color:var(--mut);font-size:15px;line-height:1.5}
.sec{padding-top:44px;scroll-margin-top:100px}
.sec h2{font-weight:400;font-size:24px;margin:0 0 4px}
.sec .sub{color:var(--mut);font-style:italic;font-size:14px;margin:0}
.fig{display:block;width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:4px;margin:20px 0 6px}
.it{padding:18px 0 0}
.r{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.n{font-weight:600;font-size:18px}.p{color:var(--mut);font-size:16px;white-space:nowrap}
.d{color:var(--mut);font-size:15px;line-height:1.55;margin:4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.grid .it{padding-top:12px}.grid .n{font-weight:400;font-size:15px}.grid .p{font-size:15px}
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);color:var(--mut);font-size:13.5px;line-height:1.7;text-align:center}
footer a{color:inherit}
</style></head><body>

function render(t){
 let h=t=='c'?``:'';
 T[t].forEach(([id,ti,im,sub,body,grid])=>{
  h+=`<section class="sec" id="${id}"><h2>[${ti}]</h2>${sub?`<p class="sub">${sub}</p>`:''}${im?`<img class="fig" src="${IM[im]}" style="object-position:${POS[im]}" alt="" loading="lazy">`:''}<div class="${grid?'grid':''}">${body.split('\n').map(item).join('')}</div></section>`});

 m.innerHTML=h;
 chips.innerHTML=T[t].map(s=>`<a href="#${s[0]}" data-id="${s[0]}">${s[1]}</a>`).join('');
 chips.scrollLeft=0;scrollTo(0,0);
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){chips.querySelectorAll('a').forEach(a=>{const on=a.dataset.id==e.target.id;a.classList.toggle('on',on);if(on)chips.scrollTo({left:a.offsetLeft-20,behavior:'smooth'})})}}),{rootMargin:'-130px 0px -70% 0px'});
 m.querySelectorAll('.sec').forEach(s=>io.observe(s));
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));render(b.dataset.t)});
